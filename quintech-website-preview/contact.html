<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Quintech — Quintech</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div>
      <div class="brand">QUINTECH</div>
      <div class="tag">Fire Solutions International</div>
    </div>
    <nav class="nav">
      <a href="index.html#dt40">DT‑40</a>
      <a href="pyrolance.html">PyroLance UHP</a>
      <a href="academy.html">Quintech Academy</a>
      <a href="field-intel.html">Field Intel</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main class="section">
  <div class="block" id="pricing">
    <h2>Request Pricing</h2>
    <p style="color:var(--muted)">Tell us which products and regions you’re buying for. We’ll respond quickly.</p>
    <form>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:680px">
        <input placeholder="Name" style="padding:10px;border-radius:8px;border:1px solid var(--line);background:#0b1117;color:var(--text)">
        <input placeholder="Email" style="padding:10px;border-radius:8px;border:1px solid var(--line);background:#0b1117;color:var(--text)">
        <input placeholder="Organization" style="padding:10px;border-radius:8px;border:1px solid var(--line);background:#0b1117;color:var(--text)">
        <input placeholder="Region / Country" style="padding:10px;border-radius:8px;border:1px solid var(--line);background:#0b1117;color:var(--text)">
        <select style="padding:10px;border-radius:8px;border:1px solid var(--line);background:#0b1117;color:var(--text)">
          <option>DT‑40 Foam</option>
          <option>PyroLance UHP</option>
          <option>Both</option>
        </select>
        <input placeholder="Estimated Volume" style="padding:10px;border-radius:8px;border:1px solid var(--line);background:#0b1117;color:var(--text)">
        <textarea placeholder="Notes" rows="5" style="grid-column:1/-1;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0b1117;color:var(--text)"></textarea>
      </div>
      <div class="actions" style="margin-top:12px">
        <a class="btn btn-primary" href="#">Send</a>
      </div>
    </form>
  </div>
</main>

<footer class="footer">© 2025 Quintech Fire Solutions International</footer>
</body>
</html>
